name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checagens:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift run GitBeatChecks
      - run: swift build -c release --product GitBeat
      - run: scripts/check-docs.sh

  segredos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Rodamos o gitleaks direto, varrendo TODO o histórico (gitleaks detect sem
      # --log-opts percorre todos os commits). A action oficial compara só o
      # intervalo do push (anterior..novo), e isso quebra depois de um force push,
      # quando o commit anterior deixa de existir. Varrer tudo é mais robusto e
      # mais completo.
      - name: Instalar gitleaks
        run: |
          VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Varrer o histórico atrás de segredos
        run: gitleaks detect --source . --redact -v
